<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EventHub · Iniciar sesión</title>
  <style>
    :root {
      --navy: #14213D;
      --paper: #F7F6F2;
      --card: #FDFCF9;
      --line: #DAD6CC;
      --text: #3D4A5C;
      --muted: #5B6678;
      --accent: #C2410C;
      --error-bg: #FDECEA;
      --error-text: #9B1C1C;
      --ok: #166534;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--paper); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      display: flex; flex-direction: column;
    }
    header {
      background: var(--navy); color: var(--paper); padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { margin: 0; font-size: 20px; letter-spacing: 0.02em; }
    header span { font-size: 14px; color: #C9D3E3; }
    main { flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: 48px 16px; }
    .card {
      width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; padding: 32px; box-shadow: 0 6px 24px rgba(20, 33, 61, 0.06);
    }
    .wide { max-width: 760px; }
    h2 { margin: 0 0 8px; color: var(--navy); font-size: 24px; }
    p.lead { margin: 0 0 24px; color: var(--muted); }
    label { display: block; font-weight: 600; font-size: 14px; margin: 16px 0 6px; color: var(--navy); }
    input {
      width: 100%; padding: 12px 14px; font-size: 16px; border: 1px solid var(--line);
      border-radius: 8px; background: #fff; color: var(--text);
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
    button {
      margin-top: 24px; width: 100%; padding: 12px; font-size: 16px; font-weight: 600;
      color: #fff; background: var(--navy); border: 0; border-radius: 8px; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    button.secondary { width: auto; padding: 10px 18px; margin: 0; background: var(--accent); }
    .error {
      margin-top: 20px; padding: 12px 14px; border-radius: 8px; background: var(--error-bg);
      color: var(--error-text); font-size: 14px; border-left: 4px solid var(--error-text);
    }
    .error strong { display: block; margin-bottom: 2px; }
    .error code { font-size: 12px; }
    .hint { margin-top: 20px; font-size: 13px; color: var(--muted); }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; background: #E6F4EA; color: var(--ok); font-size: 13px; font-weight: 600; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 24px 0; font-size: 15px; }
    dt { color: var(--muted); }
    dd { margin: 0; color: var(--navy); font-weight: 600; word-break: break-all; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; }
    h3 { margin: 32px 0 8px; color: var(--navy); font-size: 18px; }
    .hidden { display: none; }
    footer { text-align: center; font-size: 12px; color: var(--muted); padding: 16px; }
  </style>
</head>
<body>
  <header>
    <h1>EventHub</h1>
    <span>Aplicaciones Distribuidas · API v1</span>
  </header>

  <main>
    <!-- Vista 1: inicio de sesión -->
    <section id="login-view" class="card">
      <h2>Iniciar sesión</h2>
      <p class="lead">Entra con tu usuario y contraseña.</p>
      <form id="login-form" novalidate>
        <label for="username">Usuario</label>
        <input id="username" name="username" autocomplete="username" required>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="login-button" type="submit">Entrar</button>
      </form>
      <div id="login-error" class="error hidden" role="alert"></div>
      <p class="hint">Usuario de prueba: <b>admin</b> · contraseña: <b>Admin#2026</b></p>
    </section>

    <!-- Vista 2: página de inicio -->
    <section id="home-view" class="card wide hidden">
      <div class="row">
        <div>
          <h2 id="welcome">Bienvenido</h2>
          <span class="badge">Sesión iniciada</span>
        </div>
        <button id="logout-button" class="secondary" type="button">Cerrar sesión</button>
      </div>
      <dl>
        <dt>Usuario</dt><dd id="profile-username"></dd>
        <dt>Rol</dt><dd id="profile-role"></dd>
        <dt>Token válido hasta</dt><dd id="profile-expires"></dd>
      </dl>
      <h3>Ponentes registrados</h3>
      <div id="speakers"></div>
    </section>
  </main>

  <footer>EventHub API · demo de login sin segundo factor</footer>

  <script>
    const API = '/api/v1';
    const $ = (id) => document.getElementById(id);
    let session = null; // { token, expiresAt } solo en memoria de la página

    function showError(error) {
      const box = $('login-error');
      box.innerHTML = '';
      const title = document.createElement('strong');
      title.textContent = error.message || 'No se pudo iniciar sesión';
      const detail = document.createElement('code');
      detail.textContent = `HTTP ${error.status} · ${error.code}`;
      box.append(title, detail);
      box.classList.remove('hidden');
    }

    async function request(path, options = {}) {
      const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
      if (session) headers.Authorization = `Bearer ${session.token}`;
      const response = await fetch(API + path, { ...options, headers });
      const body = response.status === 204 ? null : await response.json().catch(() => null);
      if (!response.ok) {
        throw (body && body.error) || { status: response.status, code: 'ERROR', message: 'Error inesperado' };
      }
      return body;
    }

    async function loadSpeakers() {
      const container = $('speakers');
      try {
        const speakers = await request('/speakers');
        if (!speakers.length) { container.textContent = 'No hay ponentes registrados.'; return; }
        const table = document.createElement('table');
        table.innerHTML = '<tr><th>Nombre</th><th>Institución</th><th>Especialidad</th></tr>';
        for (const s of speakers) {
          const row = table.insertRow();
          for (const value of [s.nombre, s.institucion, s.especialidad]) row.insertCell().textContent = value;
        }
        container.replaceChildren(table);
      } catch (error) {
        container.textContent = `No se pudieron cargar los ponentes (${error.code}).`;
      }
    }

    async function showHome() {
      const profile = await request('/auth/me');
      $('welcome').textContent = `Bienvenido, ${profile.nombre}`;
      $('profile-username').textContent = profile.username;
      $('profile-role').textContent = profile.rol;
      $('profile-expires').textContent = new Date(session.expiresAt).toLocaleString('es-MX');
      $('login-view').classList.add('hidden');
      $('home-view').classList.remove('hidden');
      document.title = 'EventHub · Inicio';
      loadSpeakers();
    }

    $('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      $('login-error').classList.add('hidden');
      const button = $('login-button');
      button.disabled = true;
      button.textContent = 'Entrando…';
      try {
        const result = await request('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ username: $('username').value, password: $('password').value }),
        });
        session = { token: result.token, expiresAt: result.expiresAt };
        await showHome();
      } catch (error) {
        session = null;
        showError(error);
      } finally {
        button.disabled = false;
        button.textContent = 'Entrar';
      }
    });

    $('logout-button').addEventListener('click', async () => {
      try { await request('/auth/logout', { method: 'POST' }); } catch (_) { /* el token ya no sirve */ }
      session = null;
      $('password').value = '';
      $('home-view').classList.add('hidden');
      $('login-view').classList.remove('hidden');
      document.title = 'EventHub · Iniciar sesión';
    });
  </script>
</body>
</html>
